name: Test PyShEx
env:
  UV_VERSION: "0.12.18"
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Weekly, to catch breakage from new upstream releases and new Python versions
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install tox
        run: python -m pip install tox
      - name: Run codespell
        run: tox -e codespell

  policy:
    # LinkML's constraints: backward-compatible API, current Python support, no unexpected heavy dependencies.
    # Runs the same hooks as pre-commit, so a local commit that passes will pass here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Pre-commit hooks (lockfile, contract and policy tests)
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: API compatibility with the previous release
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') && '1' || '0' }}
        run: uv run --no-project --with 'griffe>=2,<3' python .github/scripts/api_compat.py

  test:
    needs:
      - quality-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Test on Windows with only the oldest and newest Python versions
    # See https://github.com/snok/install-poetry#running-on-windows
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Verify uv.lock is up-to-date
        run: uv lock --check

      - name: Generate coverage results
        # Set bash shell to fail correctly on Windows https://github.com/actions/runner-images/issues/6668
        shell: bash
        env:
          SKIP_EXTERNAL_URLS: "true"
        run: |
          uv run coverage run -m pytest
          uv run coverage xml
          uv run coverage report -m

      - name: Upload coverage report
        uses: codecov/codecov-action@v6.0.0
        with:
          name: codecov-results-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  downstream:
    # Install this PyShEx with the latest releases of its known PyPI clients in ONE resolution
    # (proves our pins stay compatible with theirs), then run the clients against it.
    needs:
      - quality-checks
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags give the real version; linkml needs pyshex >= 0.9.0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install PyShEx with linkml and jupyter-rdfify
        run: |
          uv venv "$RUNNER_TEMP/downstream"
          uv pip install --python "$RUNNER_TEMP/downstream" . linkml jupyter-rdfify pytest
          uv pip list --python "$RUNNER_TEMP/downstream" | grep -Ei '^(pyshex|linkml|jupyter-rdfify|rdflib) '
      - name: Run contract tests against the installed packages
        # Copy the tests out of the checkout so they import the installed pyshex, not the source tree
        run: |
          cp -r tests/test_contract "$RUNNER_TEMP/test_contract"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/downstream/bin/python" -m pytest -p no:cacheprovider -rs test_contract

  python-next:
    # Early warning for the next CPython release (pre-releases). Does not block merging.
    needs:
      - quality-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags give the real version; linkml needs pyshex >= 0.9.0
      - name: Install uv
        # Latest uv: older releases do not know about new CPython pre-releases
        uses: astral-sh/setup-uv@v7
      - name: Test on the next Python
        id: next
        continue-on-error: true
        run: |
          uv python install 3.15
          uv venv -p 3.15 "$RUNNER_TEMP/next"
          uv pip install --python "$RUNNER_TEMP/next" . pytest
          cp -r tests/test_contract "$RUNNER_TEMP/test_contract"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/next/bin/python" -m pytest -p no:cacheprovider test_contract
      - name: Report next-Python failure as a warning
        if: steps.next.outcome == 'failure'
        run: echo "::warning title=Next Python::PyShEx tests fail on the upcoming Python release; see the 'Test on the next Python' step"
