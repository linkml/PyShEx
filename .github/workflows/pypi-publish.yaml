name: Publish Python Package

on:
  release:
    types: [created]

jobs:
  build:
    name: Build distributions 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch full git tags
      run: git fetch --tags

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install Python 3.13
      run: uv python install 3.13

    - name: Build
      run: uv build

    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/


  verify:
    # Refuse to publish a release that would break existing users (see tests/test_contract/README.md)
    name: Verify distributions 🔍
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download dist
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Check package metadata
      run: uvx twine check --strict dist/*

    - name: No breaking API change unless this is a breaking-change release
      run: uv run --no-project --with 'griffe>=2,<3' python .github/scripts/api_compat.py --new-version "${{ github.event.release.tag_name }}"

    - name: Contract tests against the built wheel
      # Run from outside the checkout so the tests import the installed wheel
      run: |
        uv venv "$RUNNER_TEMP/verify"
        uv pip install --python "$RUNNER_TEMP/verify" dist/*.whl pytest
        cp -r tests/test_contract "$RUNNER_TEMP/test_contract"
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/verify/bin/shexeval" --help > /dev/null
        "$RUNNER_TEMP/verify/bin/python" -m pytest -p no:cacheprovider test_contract


  publish-testpypi:
    name: Publish to TestPyPI
    needs: verify
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment: testpypi

    steps:
    - name: Download dist
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI 📦
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/


  publish-pypi:
    name: Publish to PyPI
    needs: verify
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment: pypi

    steps:
    - name: Download dist
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI 📦
      uses: pypa/gh-action-pypi-publish@v1.14.0